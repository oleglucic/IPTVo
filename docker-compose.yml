version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iptvo
      POSTGRES_USER: iptvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptvo -d iptvo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  iptvo:
    image: itsoleglucic/iptvo:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://iptvo:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iptvo
      - REDIS_URL=redis://redis:6379
      - LOGO_PROXY_URL=${LOGO_PROXY_URL:-https://assets.oleglucic.com/logo}
      - PORT=${PORT:-3000}
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-0}
      - ASSET_BASE_URL=${ASSET_BASE_URL:-}
      - ADDON_CACHE_URL=${ADDON_CACHE_URL:-}
      - EDGE_PURGE_SECRET=${EDGE_PURGE_SECRET:-}
      - EPG_HUB_CONCURRENCY=${EPG_HUB_CONCURRENCY:-3}
      - MAX_CONCURRENT_PARSES=${MAX_CONCURRENT_PARSES:-4}
      - PREWARM_CONCURRENCY=${PREWARM_CONCURRENCY:-8}
      - CONCURRENCY_LIMIT_ENABLED=${CONCURRENCY_LIMIT_ENABLED:-false}
      - CONCURRENCY_EVICTION_COUNTDOWN_MS=${CONCURRENCY_EVICTION_COUNTDOWN_MS:-15000}
      - CONCURRENCY_SESSION_IDLE_TIMEOUT_MS=${CONCURRENCY_SESSION_IDLE_TIMEOUT_MS:-45000}
      - TRANSCODE_ENABLED=${TRANSCODE_ENABLED:-false}
      - TRANSCODE_RENDITIONS=${TRANSCODE_RENDITIONS:-1080,720,480,360}
      - TRANSCODE_CODEC=${TRANSCODE_CODEC:-h264}
      - TRANSCODE_HWACCEL=${TRANSCODE_HWACCEL:-none}
      - TRANSCODE_CRF=${TRANSCODE_CRF:-23}
      - TRANSCODE_PRESET=${TRANSCODE_PRESET:-veryfast}
      - TRANSCODE_MAX_CONCURRENT_JOBS=${TRANSCODE_MAX_CONCURRENT_JOBS:-2}
      - TRANSCODE_VAAPI_DEVICE=${TRANSCODE_VAAPI_DEVICE:-/dev/dri/renderD128}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
    volumes:
      - iptvo_cache:/app/cache
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  iptvo_cache:

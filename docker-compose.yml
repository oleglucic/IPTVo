version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iptvo
      POSTGRES_USER: iptvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptvo -d iptvo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  iptvo:
    image: itsoleglucic/iptvo:latest
    # For building from source, comment out 'image' and uncomment 'build:'
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://iptvo:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iptvo
      - REDIS_URL=redis://redis:6379
      - LOGO_PROXY_URL=${LOGO_PROXY_URL:-https://assets.oleglucic.com/logo}
# Optional feature flags (unset = defaults)
      - PORT=${PORT:-3000}
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-0}          # 0=single, 'auto'=cores/2, N=workers
      - ASSET_BASE_URL=${ASSET_BASE_URL:-}
      - ADDON_CACHE_URL=${ADDON_CACHE_URL:-}
      - EDGE_PURGE_SECRET=${EDGE_PURGE_SECRET:-}
      - EPG_HUB_CONCURRENCY=${EPG_HUB_CONCURRENCY:-3}
      - MAX_CONCURRENT_PARSES=${MAX_CONCURRENT_PARSES:-4}
      - PREWARM_CONCURRENCY=${PREWARM_CONCURRENCY:-8}
      # Hostnames allowed to verify Turnstile tokens (comma-separated, e.g. iptvo.oleglucic.com)
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-}
      # Turnstile secret for auth bot protection (optional; unset disables the check)
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
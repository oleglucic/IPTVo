name = "iptvo-logo-proxy"
main = "logo-proxy.worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace for dead URL tracking (24h TTL)
[[kv_namespaces]]
binding = "LOGO_KV"
id = "cf2936e0989a4e02b5fa34186abe619e"
preview_id = "cf2936e0989a4e02b5fa34186abe619e"

# Environment variables
[vars]
LOG_LEVEL = "info"

# Limits
limits = { cpu_ms = 50 }

# [triggers]
# cron = "0 * * * *"  # Optional: cron trigger for maintenance
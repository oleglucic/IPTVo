# Semgrep OSS SAST (free alternative to Fortify)
#
# Replaces the previous Fortify-on-Demand step. Semgrep's open-source engine
# and community rulesets are fully free — no account, license or tokens required.
# It complements the existing CodeQL workflow (which provides deep taint
# analysis); Semgrep adds fast, PR-friendly, high-signal coverage.
#
# Behavour:
#   - On PRs: scan the whole tree, produce SARIF, upload to the GitHub Code
#     Scanning tab (free on this public repo), and FAIL the check on any
#     ERROR-severity finding that is not explicitly suppressed via `# nosemgrep`.
#   - On push to main / weekly schedule: full-tree scan and SARIF baseline.
#
# No GitHub secrets or variables are required to enable this.

name: Semgrep SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '20 17 * * 1'   # weekly full scan (rule-update catch)

permissions:
  contents: read
  security-events: write   # upload SARIF to Code Scanning

jobs:
  semgrep:
    name: Semgrep scan (OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Official Semgrep image with the engine pre-installed.
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history only on scheduled/mainline scans (ignored-by-default
          # history rules work); shallow is enough for PR diff scanning anyway.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: Run Semgrep (p/default + JS + security packs)
        # Informational (non-blocking) by default: findings are uploaded to the
        # Security tab + PR annotations for triage, but do not fail the check.
        # This mirrors the recommended roll-out — let Semgrep report for a
        # period, triage/annotate real issues, then promote to a gate (add
        # `--error`) once the noise is understood. CodeQL already gates on
        # security findings; Semgrep complements it with fast PR-level signal.
        # p/secrets is a cheap cross-check on top of gitleaks/CodeQL secrets.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif \
            --exclude node_modules \
            --exclude coverage \
            --exclude dist \
            --exclude "src/cache" || true

      - name: Upload Semgrep SARIF to Code Scanning
        # Best-effort: uploads to the Security tab. On a private repo without
        # GitHub Advanced Security this would be skipped gracefully.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SARIF as artifact (evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 90
name: Documentation Validation

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.markdown'
      - 'README*'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.markdown'
      - 'README*'
      - 'docs/**'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdown lint
        run: npm install --save-dev markdownlint-cli

      - name: Run markdownlint
        run: npx markdownlint "**/*.md" "**/*.markdown" --disable MD013 --disable MD041

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdown link check
        run: npm install --save-dev markdown-link-check

      - name: Check links in markdown files
        run: npx markdown-link-check "**/*.md" "**/*.markdown" --config ./markdown-link-check.config.json

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: linkcheck_report*.html

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup codespell
        uses: streetsidesoftware/codespell-action@v1
        with:
          skip: "*.git*,node_modules/*"
          write-changes: false
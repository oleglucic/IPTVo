name: Documentation Validation

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.markdown'
      - 'README*'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.markdown'
      - 'README*'
      - 'docs/**'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdown lint
        run: npm install --save-dev markdownlint-cli

      - name: Run markdownlint
        run: npx markdownlint $(find . -name "*.md" -o -name "*.markdown" | sort) --disable MD013 --disable MD041

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdown link check
        run: npm install --save-dev markdown-link-check

      - name: Check links in markdown files
        run: npx markdown-link-check $(find . -name "*.md" -o -name "*.markdown" | sort | head -n 100) --config ./markdown-link-check.config.json

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: linkcheck_report*.html

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install codespell
        run: npm install --save-dev codespell

      - name: Check spelling
        run: npx codespell $(find . -name "*.md" -o -name "*.markdown" -o -name "*.txt" -o -name "*.js" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" -o -name "*.html" -o -name "*.css" | sort | head -n 100)
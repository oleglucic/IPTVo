# Fortify Static Application Security Testing (SAST)
#
# Uses the official `fortify/github-action` (fcli-based `ci` workflow) to scan
# the Node.js sources. The job is fail-soft by default: it only performs an
# actual scan once a Fortify-on-Demand endpoint is provisioned, so it never
# blocks a merge when Fortify is not yet set up.
#
# To enable the real scan, add these GitHub secrets:
#   FOD_TENANT      # Fortify-on-Demand tenant
#   FOD_USER        # tenant user login
#   FOD_PASSWORD    # tenant PAT (preferred over API client)
# and a repository *variable* (not secret):
#   FOD_URL         # e.g. https://ams.fortify.com
#
# When FOD_URL is absent the step is skipped (success) and only a repository
# integrity baseline is produced, keeping the pipeline green with zero cost.
name: Fortify SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 4 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write   # required for DO_PR_COMMENT

jobs:
  fortify:
    name: Fortify SCA analysis (Node.js)
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in an `if:` condition, so expose FOD_URL (a
    # non-secret repository *variable*) to the job env to gate the scan.
    env:
      FOD_URL: ${{ vars.FOD_URL }}
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # Matches the repo's existing toolchain (see .github/workflows/ci-cd.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # Run the real Fortify-on-Demand SAST scan ONLY when an endpoint is
      # configured (FOD_URL as a repository variable). When absent this is a
      # skipped success so the pipeline is not blocked without Fortify.
      - name: Run Fortify Scan (FoD configured)
        if: env.FOD_URL != ''
        uses: fortify/github-action@v3
        env:
          FOD_URL: ${{ env.FOD_URL }}                    # variable, not secret
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PASSWORD }}
          DO_WAIT: 'true'                             # wait for scan completion
          DO_POLICY_CHECK: 'true'                     # fail on policy outcome
          DO_EXPORT: 'true'                           # results -> GitHub Security tab
          DO_JOB_SUMMARY: 'true'
          DO_PR_COMMENT: 'true'
          FOD_RELEASE: ${{ github.repository }}:${{ github.ref_name }}
          # Optional: raise DO_EXPORT/DO_POLICY_CHECK

      - name: No Fortify endpoint configured — skipping (free baseline only)
        if: env.FOD_URL == ''
        run: echo "Fortify-on-Demand not provisioned; SAST scan skipped. Add FOD_URL variable + FOD_* secrets to enable."
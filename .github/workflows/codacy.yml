# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and uploads results via Codacy GitHub App (recommended over manual SARIF upload)
# For more information on the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 0 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup Node.js 24 (avoid Node 20 deprecation warning)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Execute Codacy Analysis CLI and push results via GitHub App
      # This avoids SARIF upload category conflicts from GitHub API changes
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          # Use GitHub App integration (default) - pushes results directly to Codacy/GitHub
          # Don't output SARIF file to avoid multi-run category conflicts
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

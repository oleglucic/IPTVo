name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write
  security-events: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm audit --production
      - run: node --check server.js

  release:
    name: Release
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      # persist-credentials: false — do NOT leave the default github-actions[bot]
      # token in git's credential config. @semantic-release/git shells out to a
      # real `git push <url>` process, and that process authenticates from git's
      # own credential/extraheader config — NOT the GITHUB_TOKEN env var. A
      # persisted bot credential makes the push authenticate as the bot, which is
      # not a bypass actor on the `main` ruleset, hence GH013. Only the App
      # installation token (registered as git's credential in the step below) is a
      # bypass actor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - name: Generate GitHub App token for release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope the token to this single repository. The `iptvo-release`
          # App is a bypass actor on the `main` ruleset, and the bypass only
          # applies when the token is scoped to the specific repository
          # (an unscoped multi-installation token is not granted bypass).
          owner: oleglucic
          repositories: IPTVo
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # git authenticates the raw `git push` that @semantic-release/git runs from
      # its own http.extraheader config, not from the GITHUB_TOKEN env. Register
      # the App installation token there so the push is authenticated as the
      # iptvo-release App — a bypass actor on the `main` branch ruleset.
      - name: Configure git authentication with App token
        run: |
          git config --global user.name "iptvo-release[bot]"
          git config --global user.email "4651159+iptvo-release[bot]@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ steps.app-token.outputs.token }}" | base64 -w0)"
      - name: Release
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        env:
          # Used by @semantic-release/* plugins that call the GitHub API
          # (release creation, etc.). The `git push` uses the credential header
          # set above; the App token is a bypass actor on the `main` ruleset, so
          # @semantic-release/git can push the version-bump commit to the
          # protected branch. github-actions[bot] cannot bypass protection.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Setup Docker Buildx
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      - name: Extract metadata for Docker
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            itsoleglucic/iptvo
            ghcr.io/oleglucic/iptvo
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.description=AI-powered IPTV backend for Stremio/Nuvio with channel curation, EPG, and logo caching
      - name: Build and push Docker image
        if: secrets.DOCKERHUB_TOKEN != \x27\x27 && secrets.GITHUB_TOKEN != \x27\x27
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      # Syncs the Docker Hub repository short description + README. Requires
      # DOCKERHUB_TOKEN to have Read & Write scope; failures here should not
      # fail the image push, so this step is marked continue-on-error.
      - name: Update Docker Hub description
        if: secrets.DOCKERHUB_TOKEN != \x27\x27
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: itsoleglucic/iptvo
          readme-filepath: ./README.md
          short-description: AI-powered IPTV backend for Stremio/Nuvio

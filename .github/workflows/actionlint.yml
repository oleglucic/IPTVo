name: actionlint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download actionlint
        shell: bash
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          printf "%s" "$PWD" >> "$GITHUB_PATH"

      - name: Lint all workflows
        # Disable shellcheck integration: actionlint's gate value is catching
        # workflow schema/syntax/`on:`/expression errors, not shell style nits
        # in existing run: scripts. The latter are pre-existing and out of scope.
        shell: bash
        run: actionlint -color -shellcheck=
